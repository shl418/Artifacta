openapi: 3.1.0
info:
  title: Artifacta API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/projects:
    get:
      summary: List projects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: visibility
          in: query
          schema:
            $ref: "#/components/schemas/ProjectVisibility"
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Publish artifact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, html_file]
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  $ref: "#/components/schemas/ProjectVisibility"
                html_file:
                  type: string
                  format: binary
                data_files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Published project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}:
    get:
      summary: Get project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/html:
    put:
      summary: Replace project HTML
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [html_file]
              properties:
                html_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/datasets:
    get:
      summary: List project datasets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add project dataset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Created dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync/trigger:
    post:
      summary: Queue dataset sync
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "202":
          description: Sync job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncQueuedResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sync/jobs/claim:
    post:
      summary: Claim next queued sync job
      description: Worker endpoint that claims and executes the next queued sync job for the authenticated organization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Claimed job or null when no work is queued
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/SyncJobClaim"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: JSON error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProjectVisibility:
      type: string
      enum: [private, team, public]
    ProjectSummary:
      type: object
      required: [id, name, visibility]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        preview_url:
          type: string
          format: uri-reference
        datasets_count:
          type: integer
        views_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            html_url:
              type: string
              format: uri-reference
            datasets:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"
            owner_id:
              type: string
    Dataset:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        file_name:
          type: string
        file_type:
          type: string
        size:
          type: integer
        rows:
          type:
            - integer
            - "null"
        columns:
          type:
            - integer
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SyncQueuedResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
    SyncJobClaim:
      type: object
      required: [job_id, status, project_id, dataset_id]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [running, success, failed]
        project_id:
          type: string
        dataset_id:
          type: string
        rows_synced:
          type: integer
        error:
          type:
            - string
            - "null"
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
