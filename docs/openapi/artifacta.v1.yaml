openapi: 3.1.0
info:
  title: Artifacta API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login with local email auth
      security: []
      responses:
        "200":
          description: Session cookie and user
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current user
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      summary: Clear session cookie
      security: []
      responses:
        "200":
          description: Logged out
  /api/v1/auth/oidc/login:
    get:
      summary: Start OIDC login
      security: []
      responses:
        "302":
          description: Redirect to provider
        "501":
          $ref: "#/components/responses/Error"
  /api/v1/auth/oidc/callback:
    get:
      summary: Complete OIDC login
      security: []
      responses:
        "302":
          description: Redirect to app with session cookie
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/stats:
    get:
      summary: Get overview stats
      responses:
        "200":
          description: Stats, recent projects, and popular projects
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/folders:
    get:
      summary: List folders
      responses:
        "200":
          description: Folder list
    post:
      summary: Create folder
      responses:
        "201":
          description: Created folder
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/folders/{folderId}:
    patch:
      summary: Rename folder
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Updated folder
    delete:
      summary: Delete folder
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Deleted folder
  /api/v1/upload-sessions:
    post:
      summary: Inspect ZIP upload session
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                project_id:
                  type: string
                  description: When updating an existing ZIP project
      responses:
        "201":
          description: Upload session with file tree and manifest_detected flag
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/datasets:
    get:
      summary: List visible datasets
      responses:
        "200":
          description: Dataset list
  /api/v1/projects:
    get:
      summary: List projects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: visibility
          in: query
          schema:
            $ref: "#/components/schemas/ProjectVisibility"
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Publish artifact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  $ref: "#/components/schemas/ProjectVisibility"
                html_file:
                  type: string
                  format: binary
                  description: Single HTML file; mutually exclusive with upload_session_id
                upload_session_id:
                  type: string
                  description: Required for ZIP bundles; bundle datasets are imported from artifacta.json or auto-discovered
      responses:
        "201":
          description: Published project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}:
    get:
      summary: Get project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-scripts:
    get:
      summary: List bundle sync scripts for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Script list
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-scripts/{scriptId}:
    get:
      summary: Get bundle sync script
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: Script record
        "404":
          $ref: "#/components/responses/Error"
    put:
      summary: Update bundle sync script overrides
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: Updated script
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-scripts/{scriptId}/test:
    post:
      summary: Validate bundle script paths without executing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: Probe result
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-scripts/{scriptId}/trigger:
    post:
      summary: Enqueue bundle script sync job
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "202":
          description: Job queued
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/sync-scripts/{scriptId}/status:
    get:
      summary: Last script run and active job
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: Status payload
  /api/v1/projects/{projectId}/sync-scripts/{scriptId}/history:
    get:
      summary: Paginated script sync history
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ScriptId"
      responses:
        "200":
          description: History list
  /api/v1/projects/{projectId}/html:
    put:
      summary: Replace project HTML (single .html file only; ZIP uses upload session)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [html_file]
              properties:
                html_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/folder:
    patch:
      summary: Move project to folder
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Updated project
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/html/render:
    get:
      summary: Render protected dashboard HTML
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Dashboard HTML
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/html/{assetPath}:
    get:
      summary: Serve protected ZIP dashboard asset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static asset
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: |
            Asset request is blocked by hosting rules. Error envelope uses
            `code: "ASSET_BLOCKED"` with `details.reason` set to either
            `html_sibling` (sibling .html files are not served — only the
            entrypoint is reachable) or `not_zip_bundle` (project is a
            single-file HTML upload and has no asset route).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/projects/{projectId}/versions:
    get:
      summary: List dashboard versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Dashboard versions
  /api/v1/projects/{projectId}/versions/{versionId}/rollback:
    post:
      summary: Roll back dashboard artifact metadata to a recorded version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Updated project
  /api/v1/projects/{projectId}/embed-token:
    post:
      summary: Create signed embed token
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Embed token and URL
  /api/v1/projects/{projectId}/datasets:
    get:
      summary: List project datasets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Add project dataset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Created dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/datasets/{datasetId}:
    get:
      summary: Get dataset metadata
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset
    put:
      summary: Replace dataset file
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Updated dataset
    delete:
      summary: Delete dataset
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "204":
          description: Deleted dataset
  /api/v1/projects/{projectId}/datasets/{datasetId}/preview:
    get:
      summary: Preview parsed dataset rows
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Parsed preview or stored-only message
  /api/v1/projects/{projectId}/datasets/{datasetId}/versions:
    get:
      summary: List dataset versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset versions
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync:
    get:
      summary: Get dataset sync config
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Sync config
    put:
      summary: Set dataset sync config
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Sync config
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync/status:
    get:
      summary: Get latest sync status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Sync status
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync/history:
    get:
      summary: List sync history and jobs
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Sync history
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync/trigger:
    post:
      summary: Queue dataset sync
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "202":
          description: Sync job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncQueuedResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/datasets/{datasetId}/sync/test:
    post:
      summary: Test dataset sync source
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Sync source probe result
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectId}/permissions:
    get:
      summary: List project permissions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project permissions
    post:
      summary: Add or update project member
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Project member
  /api/v1/projects/{projectId}/permissions/{userId}:
    patch:
      summary: Update project member permission
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Project member
    delete:
      summary: Remove project member permission
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Removed
  /api/v1/team/members:
    get:
      summary: List team members
      responses:
        "200":
          description: Team members
    post:
      summary: Create team member
      responses:
        "201":
          description: Team member
  /api/v1/team/members/{userId}:
    patch:
      summary: Update team member role or status
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Team member
    delete:
      summary: Remove team member
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Removed
  /api/v1/team/invitations:
    post:
      summary: Invite or create team member
      responses:
        "201":
          description: Team member
  /api/v1/api-keys:
    get:
      summary: List API keys
      responses:
        "200":
          description: API keys
    post:
      summary: Create API key
      responses:
        "201":
          description: API key with secret
  /api/v1/api-keys/{keyId}:
    delete:
      summary: Delete API key
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: Deleted
  /api/v1/sync/script-jobs/claim:
    post:
      summary: Claim next queued bundle script sync job
      description: Worker endpoint that claims and executes the next queued script sync job (Python/Node in bundle directory).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Claimed script job or null
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/sync/jobs/claim:
    post:
      summary: Claim next queued dataset sync job
      description: Worker endpoint that claims and executes the next per-dataset sync job for the authenticated organization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Claimed job or null when no work is queued
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/SyncJobClaim"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/webhooks:
    get:
      summary: List webhooks
      responses:
        "200":
          description: Webhooks
    post:
      summary: Create webhook
      responses:
        "201":
          description: Webhook with secret
  /api/v1/webhooks/{webhookId}:
    patch:
      summary: Update webhook
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: Webhook
    delete:
      summary: Delete webhook
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "204":
          description: Deleted
  /api/v1/audit-logs:
    get:
      summary: List audit logs
      responses:
        "200":
          description: Audit logs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema:
        type: string
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: JSON error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProjectVisibility:
      type: string
      enum: [private, team, public]
    ProjectSummary:
      type: object
      required: [id, name, visibility]
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        preview_url:
          type: string
          format: uri-reference
        datasets_count:
          type: integer
        views_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            html_url:
              type: string
              format: uri-reference
            datasets:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"
            owner_id:
              type: string
    Dataset:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        file_name:
          type: string
        file_type:
          type: string
        size:
          type: integer
        rows:
          type:
            - integer
            - "null"
        columns:
          type:
            - integer
            - "null"
        sync_config:
          $ref: "#/components/schemas/SyncConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SyncQueuedResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
    SyncConfig:
      type: object
      properties:
        enabled:
          type: boolean
        source_type:
          type: string
          enum: [manual]
        source_config:
          type: object
        update_mode:
          type: string
          enum: [full, incremental]
        schedule:
          type:
            - string
            - "null"
        last_sync_at:
          type:
            - string
            - "null"
        last_sync_status:
          type:
            - string
            - "null"
        next_sync_at:
          type:
            - string
            - "null"
    SyncJobClaim:
      type: object
      required: [job_id, status, project_id, dataset_id]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [running, success, failed]
        project_id:
          type: string
        dataset_id:
          type: string
        rows_synced:
          type: integer
        error:
          type:
            - string
            - "null"
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
