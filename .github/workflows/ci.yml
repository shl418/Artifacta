name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:api-contract
      - run: pnpm test:client
      - run: pnpm test:security
      - run: pnpm test:unit
      - run: pnpm client:build
      - run: pnpm cli:pack

  smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start app
        run: |
          pnpm start --port 3000 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start in time"
          exit 1
        env:
          AUTH_SECRET: artifacta-ci-smoke-secret-with-32-chars-min
          DATA_DIR: .artifacta-ci
      - run: pnpm test:smoke
        env:
          ARTIFACTA_URL: http://127.0.0.1:3000
          AUTH_SECRET: artifacta-ci-smoke-secret-with-32-chars-min
          DATA_DIR: .artifacta-ci
