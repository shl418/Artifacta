<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运营 BI 看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --violet: #a371f7;
      --amber: #d29922;
      --red: #f85149;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 1200px; margin: 0 auto; padding: 32px 24px 56px; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
      margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    header code { background: rgba(88,166,255,0.12); color: var(--blue); padding: 1px 6px; border-radius: 4px; font-family: monospace; }
    .tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 0.75rem; color: var(--muted); }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .kpi-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .kpi-value { font-size: 1.7rem; font-weight: 700; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 0.77rem; color: var(--muted); }
    .up { color: var(--green); }

    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 960px) { .grid3 { grid-template-columns: 1fr; } }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
    .card-span2 { grid-column: span 2; }
    .card-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 18px; }
    .card-sub { font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-left: 6px; }
    .chart-wrap { position: relative; height: 240px; }
    .chart-wrap-lg { position: relative; height: 280px; }

    .funnel-stage { margin-bottom: 10px; }
    .stage-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.82rem; }
    .stage-name { font-weight: 500; }
    .stage-meta { color: var(--muted); font-size: 0.77rem; }
    .stage-track { height: 32px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
    .stage-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 10px; font-size: 0.8rem; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    th { text-align: left; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 12px 10px; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .loading { text-align: center; padding: 80px; color: var(--muted); }
    .error { text-align: center; padding: 80px; color: var(--red); }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>📊 运营 BI 看板</h1>
      <p>数据来源：<code>analytics/funnel.json</code> + <code>data/q2_sales.csv</code> · 双数据源示例</p>
    </div>
    <div class="tag">2024 Q2</div>
  </header>
  <div id="root" class="loading">加载数据中…</div>
</div>

<script>
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';
Chart.defaults.font.family = "'Inter', system-ui, sans-serif";

const COLORS = ['#58a6ff','#a371f7','#3fb950','#d29922','#f85149'];
const REGION_COLORS = { '华北': '#58a6ff', '华东': '#3fb950', '华南': '#a371f7' };

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  const cols = lines[0].split(',');
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    cols.forEach((c, i) => row[c.trim()] = cells[i]?.trim() || '');
    return row;
  });
}

Promise.all([
  fetch("analytics/funnel.json").then(r => { if (!r.ok) throw new Error("funnel.json " + r.status); return r.json(); }),
  fetch("data/q2_sales.csv").then(r => { if (!r.ok) throw new Error("q2_sales.csv " + r.status); return r.text(); }),
])
  .then(([funnel, salesCsv]) => render(funnel, parseCsv(salesCsv)))
  .catch(e => {
    document.getElementById('root').className = 'error';
    document.getElementById('root').textContent = '加载失败: ' + e.message + ' — 请用 npx serve . 预览';
  });

function fmt(n) { return Number(n).toLocaleString('zh-CN'); }
function fmtMoney(n) { return '¥' + (Number(n) / 10000).toFixed(1) + '万'; }

function render(funnel, sales) {
  const top = funnel[0].users;
  const bottom = funnel[funnel.length - 1].users;
  const overallCvr = ((bottom / top) * 100).toFixed(2);
  const totalRev = sales.reduce((s, r) => s + Number(r.revenue), 0);
  const totalOrders = sales.reduce((s, r) => s + Number(r.orders), 0);

  const months = [...new Set(sales.map(r => r.month))].sort();
  const regions = [...new Set(sales.map(r => r.region))];
  const monthRev = months.map(m => sales.filter(r => r.month === m).reduce((s, r) => s + Number(r.revenue), 0));

  document.getElementById('root').innerHTML = `
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">漏斗顶部</div>
        <div class="kpi-value" style="color:var(--blue)">${fmt(top)}</div>
        <div class="kpi-sub">${funnel[0].stage} 用户</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">整体转化率</div>
        <div class="kpi-value" style="color:var(--green)">${overallCvr}%</div>
        <div class="kpi-sub">${funnel.length} 阶段漏斗</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Q2 总营收</div>
        <div class="kpi-value" style="color:var(--violet)">${fmtMoney(totalRev)}</div>
        <div class="kpi-sub up">↑ 18.7% 同比</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Q2 总订单</div>
        <div class="kpi-value" style="color:var(--amber)">${fmt(totalOrders)}</div>
        <div class="kpi-sub">3 大区合计</div>
      </div>
    </div>

    <div class="grid3" style="margin-bottom:16px">
      <div class="card card-span2">
        <div class="card-title">Q2 月度营收趋势 <span class="card-sub">按大区</span></div>
        <div class="chart-wrap-lg"><canvas id="lineChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">获客漏斗</div>
        <div id="funnelEl"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">大区营收对比</div>
        <div class="chart-wrap"><canvas id="barChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">订单明细</div>
        <table>
          <thead><tr><th>月份</th><th>大区</th><th class="num">营收</th><th class="num">订单</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  // Funnel
  const funnelEl = document.getElementById('funnelEl');
  funnel.forEach((s, i) => {
    const pct = (s.users / top * 100).toFixed(0);
    const stepCvr = i === 0 ? '' : ` → ${((s.users / funnel[i-1].users) * 100).toFixed(0)}%`;
    funnelEl.innerHTML += `<div class="funnel-stage">
      <div class="stage-header">
        <span class="stage-name">${s.stage}</span>
        <span class="stage-meta">${fmt(s.users)}${stepCvr}</span>
      </div>
      <div class="stage-track">
        <div class="stage-fill" style="width:${pct}%;background:linear-gradient(90deg,${COLORS[i]},${COLORS[i]}88)">${pct}%</div>
      </div>
    </div>`;
  });

  // Line chart (revenue by month and region)
  new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: months.map(m => m.slice(5)),
      datasets: regions.map((reg, i) => ({
        label: reg,
        data: months.map(m => {
          const row = sales.find(r => r.month === m && r.region === reg);
          return row ? Number(row.revenue) : 0;
        }),
        borderColor: Object.values(REGION_COLORS)[i] || COLORS[i],
        backgroundColor: (Object.values(REGION_COLORS)[i] || COLORS[i]) + '22',
        fill: false,
        tension: 0.3,
        pointRadius: 5,
        borderWidth: 2,
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 10, padding: 16 } } },
      scales: {
        x: { grid: { color: '#21262d' } },
        y: { grid: { color: '#21262d' }, ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } }
      }
    }
  });

  // Bar chart (total revenue by region)
  const regionTotals = regions.map(reg => sales.filter(r => r.region === reg).reduce((s, r) => s + Number(r.revenue), 0));
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: regions,
      datasets: [{
        data: regionTotals,
        backgroundColor: regions.map((reg, i) => (Object.values(REGION_COLORS)[i] || COLORS[i]) + 'cc'),
        borderColor: regions.map((reg, i) => Object.values(REGION_COLORS)[i] || COLORS[i]),
        borderWidth: 1,
        borderRadius: 8,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#21262d' } },
        y: { grid: { color: '#21262d' }, ticks: { callback: v => '¥' + (v/10000).toFixed(0) + '万' } }
      }
    }
  });

  // Table
  const tbody = document.getElementById('tableBody');
  sales.forEach(r => {
    tbody.innerHTML += `<tr>
      <td>${r.month.slice(5)}</td>
      <td>${r.region}</td>
      <td class="num">${fmtMoney(r.revenue)}</td>
      <td class="num">${fmt(r.orders)}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
