<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add-One Demo · Funnel</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --blue: #58a6ff; --green: #3fb950; --violet: #a371f7;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    .shell { max-width: 960px; margin: 0 auto; padding: 32px 24px 56px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;
      margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    header code { background: rgba(88,166,255,0.12); color: var(--blue); padding: 1px 6px; border-radius: 4px; font-family: monospace; }
    .badge { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px; font-size: 0.75rem; color: var(--muted); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
    @media (max-width: 720px) { .kpis { grid-template-columns: 1fr; } }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .kpi-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .kpi-value { font-size: 1.7rem; font-weight: 700; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
    .card-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 18px; }
    .chart-wrap { position: relative; height: 280px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; font-size: 0.67rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 12px 10px; }
    td { padding: 9px 12px; border-top: 1px solid var(--border); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .loading, .error { text-align: center; padding: 80px; color: var(--muted); }
    .error { color: #f85149; }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>📈 Funnel Metrics</h1>
      <p>Source: <code>data/metrics.csv</code> · synced by <code>scripts/sync.py</code></p>
    </div>
    <div class="badge"><div class="dot"></div>Add-One sync demo</div>
  </header>
  <div id="root" class="loading">Loading data…</div>
</div>

<script>
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  const cols = lines[0].split(',').map(c => c.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    cols.forEach((c, i) => row[c] = (cells[i] ?? '').trim());
    return row;
  });
}

const fmt = n => Number(n).toLocaleString('en-US');

// Relative path — works the same locally (npx serve .) and on Artifacta hosting.
fetch('data/metrics.csv')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(t => render(parseCsv(t)))
  .catch(e => {
    const root = document.getElementById('root');
    root.className = 'error';
    root.textContent = 'Load failed: ' + e.message + ' — preview with `npx serve .`';
  });

function render(rows) {
  const totalUsers = rows.reduce((s, r) => s + Number(r.users), 0);
  const totalConv = rows.reduce((s, r) => s + Number(r.conversions), 0);
  const paid = rows.find(r => r.stage.toLowerCase() === 'paid');
  const top = rows[0];
  const convRate = top && Number(top.users) ? (Number(paid ? paid.users : 0) / Number(top.users) * 100).toFixed(1) : '0';

  document.getElementById('root').className = '';
  document.getElementById('root').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Total Users</div><div class="kpi-value" style="color:var(--blue)">${fmt(totalUsers)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Conversions</div><div class="kpi-value" style="color:var(--green)">${fmt(totalConv)}</div></div>
      <div class="kpi"><div class="kpi-label">Visit → Paid</div><div class="kpi-value" style="color:var(--violet)">${convRate}%</div></div>
    </div>
    <div class="card">
      <div class="card-title">Users by stage</div>
      <div class="chart-wrap"><canvas id="funnel"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Detail</div>
      <table>
        <thead><tr><th>Stage</th><th class="num">Users</th><th class="num">Conversions</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${r.stage}</td><td class="num">${fmt(r.users)}</td><td class="num">${fmt(r.conversions)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  new Chart(document.getElementById('funnel'), {
    type: 'bar',
    data: {
      labels: rows.map(r => r.stage),
      datasets: [{
        label: 'Users',
        data: rows.map(r => Number(r.users)),
        backgroundColor: 'rgba(88,166,255,0.55)',
        borderColor: '#58a6ff',
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false } }, y: { grid: { color: '#21262d' }, beginAtZero: true } }
    }
  });
}
</script>
</body>
</html>
