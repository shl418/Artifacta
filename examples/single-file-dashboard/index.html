<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artifacta Single File Example</title>
    <style>
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f7faf8; color: #14211d; }
      main { max-width: 880px; margin: 0 auto; padding: 32px; }
      section { border: 1px solid #d8e5df; border-radius: 8px; background: white; padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .metric { border: 1px solid #e2ebe7; border-radius: 8px; padding: 16px; }
      .value { font-size: 28px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Artifacta Single File Example</h1>
      <section class="grid">
        <div class="metric"><p>Revenue</p><div class="value">$128K</div></div>
        <div class="metric"><p>Conversion</p><div class="value">8.4%</div></div>
        <div class="metric"><p>Accounts</p><div class="value">42</div></div>
      </section>
    </main>
  </body>
</html>
