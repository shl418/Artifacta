<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>销售日报 · 脚本同步</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --amber: #d29922;
      --red: #f85149;
      --violet: #a371f7;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 32px 24px 56px; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
      margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    header code { background: rgba(88,166,255,0.12); color: var(--blue); padding: 1px 6px; border-radius: 4px; font-family: monospace; }
    .sync-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px; font-size: 0.75rem; color: var(--muted);
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .kpi-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .kpi-value { font-size: 1.7rem; font-weight: 700; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 0.77rem; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
    .card-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 18px; }
    .chart-wrap { position: relative; height: 260px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; font-size: 0.67rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 12px 10px; }
    td { padding: 9px 12px; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface2); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .today-row td { background: rgba(88,166,255,0.06); }
    .today-row td:first-child::before { content: '▶ '; color: var(--blue); }

    .loading { text-align: center; padding: 80px; color: var(--muted); }
    .error { text-align: center; padding: 80px; color: var(--red); }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>📅 销售日报</h1>
      <p>数据来源：<code>sales.csv</code> · 由 <code>pull_sales.py</code> 每日同步</p>
    </div>
    <div class="sync-badge"><div class="sync-dot"></div>脚本同步示例</div>
  </header>
  <div id="root" class="loading">加载数据中…</div>
</div>

<script>
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';
Chart.defaults.font.family = "'Inter', system-ui, sans-serif";

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  const cols = lines[0].split(',');
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    cols.forEach((c, i) => row[c.trim()] = cells[i]?.trim() || '');
    return row;
  });
}

function fmt(n) { return Number(n).toLocaleString('zh-CN'); }
function fmtMoney(n) { return '¥' + Number(n).toLocaleString('zh-CN'); }
function delta(curr, prev) {
  if (!prev || prev == 0) return null;
  return ((curr - prev) / prev * 100).toFixed(1);
}

fetch("sales.csv")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(t => render(parseCsv(t)))
  .catch(e => {
    document.getElementById('root').className = 'error';
    document.getElementById('root').textContent = '加载失败: ' + e.message + ' — 请用 npx serve . 预览';
  });

function render(rows) {
  const latest = rows[rows.length - 1];
  const prev = rows.length > 1 ? rows[rows.length - 2] : null;
  const totalRev = rows.reduce((s, r) => s + Number(r.revenue), 0);
  const totalOrders = rows.reduce((s, r) => s + Number(r.orders), 0);
  const avgRev = totalRev / rows.length;
  const revDelta = prev ? delta(Number(latest.revenue), Number(prev.revenue)) : null;
  const orderDelta = prev ? delta(Number(latest.orders), Number(prev.orders)) : null;

  document.getElementById('root').innerHTML = `
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">最新日营收</div>
        <div class="kpi-value" style="color:var(--blue)">${fmtMoney(latest.revenue)}</div>
        <div class="kpi-sub ${revDelta >= 0 ? 'up' : 'down'}">${revDelta !== null ? (revDelta >= 0 ? '↑' : '↓') + ' ' + Math.abs(revDelta) + '% 环比昨日' : '首日数据'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">最新日订单</div>
        <div class="kpi-value" style="color:var(--green)">${fmt(latest.orders)}</div>
        <div class="kpi-sub ${orderDelta >= 0 ? 'up' : 'down'}">${orderDelta !== null ? (orderDelta >= 0 ? '↑' : '↓') + ' ' + Math.abs(orderDelta) + '% 环比昨日' : '首日数据'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">周期累计营收</div>
        <div class="kpi-value" style="color:var(--violet)">¥${(totalRev/10000).toFixed(1)}万</div>
        <div class="kpi-sub" style="color:var(--muted)">${rows.length} 天数据</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">日均营收</div>
        <div class="kpi-value" style="color:var(--amber)">${fmtMoney(Math.round(avgRev))}</div>
        <div class="kpi-sub" style="color:var(--muted)">客单价 ¥${latest.avg_order}</div>
      </div>
    </div>
    <div class="layout">
      <div class="card">
        <div class="card-title">营收 & 订单趋势</div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">日明细</div>
        <table>
          <thead><tr><th>日期</th><th class="num">营收</th><th class="num">订单</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  // Trend chart (dual axis)
  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: rows.map(r => r.date.slice(5)),
      datasets: [
        {
          label: '日营收',
          data: rows.map(r => Number(r.revenue)),
          borderColor: '#58a6ff',
          backgroundColor: 'rgba(88,166,255,0.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          borderWidth: 2,
          yAxisID: 'y',
        },
        {
          label: '订单量',
          data: rows.map(r => Number(r.orders)),
          borderColor: '#3fb950',
          backgroundColor: 'transparent',
          tension: 0.3,
          pointRadius: 3,
          borderWidth: 2,
          borderDash: [4, 3],
          yAxisID: 'y1',
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { boxWidth: 10, padding: 16 } } },
      scales: {
        x: { grid: { color: '#21262d' } },
        y: { grid: { color: '#21262d' }, ticks: { callback: v => '¥' + (v/1000).toFixed(0) + 'K' }, position: 'left' },
        y1: { grid: { display: false }, ticks: { callback: v => v + '单' }, position: 'right' }
      }
    }
  });

  const tbody = document.getElementById('tableBody');
  [...rows].reverse().forEach((r, i) => {
    const isLatest = i === 0;
    const d = i < rows.length - 1 ? delta(Number(r.revenue), Number([...rows].reverse()[i+1]?.revenue)) : null;
    tbody.innerHTML += `<tr class="${isLatest ? 'today-row' : ''}">
      <td>${r.date.slice(5)}</td>
      <td class="num">${fmtMoney(r.revenue)}</td>
      <td class="num">${fmt(r.orders)}</td>
    </tr>`;
  });
}
</script>
</body>
</html>
